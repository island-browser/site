name: Build and deploy the site

# The site takes Island's version and release notes from island-browser/island
# at build time, so it is rebuilt when this repository changes, once a day to
# pick up new versions and changelog entries, on demand, and when the browser
# repository sends an `island-updated` repository_dispatch.
#
# island-browser/island is private, so reading it needs the ISLAND_READ_TOKEN
# secret (a fine-grained token with read-only Contents access to that one
# repository). Without it the job publishes the pages as committed, with the
# version and changelog they were last rendered with, and says so.
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '17 4 * * *'
  repository_dispatch:
    types:
      - island-updated
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HAS_ISLAND_TOKEN: ${{ secrets.ISLAND_READ_TOKEN != '' }}
    steps:
      - name: Check out the site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check out Island's version, changelog and design tokens
        if: env.HAS_ISLAND_TOKEN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: island-browser/island
          ref: main
          path: island
          token: ${{ secrets.ISLAND_READ_TOKEN }}
          persist-credentials: false
          sparse-checkout: |
            VERSION
            CHANGELOG.md
            DESIGN.md
            scripts/version.py
          sparse-checkout-cone-mode: false
      - name: Note the missing Island token
        if: env.HAS_ISLAND_TOKEN != 'true'
        shell: bash
        run: |
          echo "::warning::ISLAND_READ_TOKEN is not set, so the pages are published as committed (version and changelog not refreshed, token parity not checked)."
      - name: Check the site CSS against the design tokens
        if: env.HAS_ISLAND_TOKEN == 'true'
        shell: bash
        env:
          ISLAND_DIR: island
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build the site
        shell: bash
        run: |
          if [ "$HAS_ISLAND_TOKEN" = true ]; then
            python3 scripts/build.py --island island --out _site
          else
            python3 scripts/build.py --out _site
          fi
      - name: Upload the Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - id: deployment
        name: Deploy the Pages artifact
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
