name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
  # Daily rebuild picks up new releases and changelog entries from the browser repo.
  schedule:
    - cron: "17 6 * * *"
  # The browser repo can trigger a rebuild right after it publishes a release:
  #   gh api repos/island-browser/site/dispatches -f event_type=island-release
  repository_dispatch:
    types:
      - island-release
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # The browser repo is private for now: without an ISLAND_REPO_TOKEN secret (a fine-grained
      # token with read access to island-browser/island) DESIGN.md cannot be fetched and this
      # check fails rather than passing silently.
      - name: Check design tokens against Island's DESIGN.md
        run: npm run check:tokens
        env:
          ISLAND_REPO_TOKEN: ${{ secrets.ISLAND_REPO_TOKEN }}

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      # prebuild fetches CHANGELOG.md, VERSION, and the releases list; when a fetch fails it keeps
      # the snapshot committed under data/.
      - name: Build the static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /site
          NEXT_PUBLIC_SITE_URL: https://island-browser.github.io/site
          NEXT_TELEMETRY_DISABLED: "1"
          ISLAND_REPO_TOKEN: ${{ secrets.ISLAND_REPO_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
