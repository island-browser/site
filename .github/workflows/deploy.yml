name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
  # Pull requests only lint, check, and build; they never deploy.
  pull_request:
  # Daily rebuild picks up changelog entries from the browser repo; the hourly run rebuilds only
  # when the browser repo has a newer release than the live site (see the gate job).
  schedule:
    - cron: "17 6 * * *"
    - cron: "41 * * * *"
  # The browser repo can trigger a rebuild right after it publishes a release:
  #   gh api repos/island-browser/site/dispatches -f event_type=island-release
  repository_dispatch:
    types:
      - island-release
      - island-updated
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every event builds, except the hourly schedule: it compares the newest vX.Y.Z release of the
  # browser repo with the tag in the live site's /release.txt and builds only when they differ.
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Compare the live release with the newest one
        id: check
        env:
          GH_TOKEN: ${{ secrets.ISLAND_READ_TOKEN }}
          HOURLY: ${{ github.event_name == 'schedule' && github.event.schedule == '41 * * * *' }}
        run: |
          if [ "$HOURLY" != "true" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::ISLAND_READ_TOKEN is not set, so the hourly release check cannot read the browser repo."
            echo "build=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          latest=$(gh api repos/island-browser/island/releases --jq \
            '[.[] | select((.draft | not) and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+")))] | sort_by(.published_at) | last | .tag_name // "none"')
          live=$(curl -fsS https://island-browser.github.io/site/release.txt || echo unknown)
          echo "newest release: $latest, live site: $live"
          if [ "$latest" != "$live" ]; then echo "build=true"; else echo "build=false"; fi >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HAS_ISLAND_TOKEN: ${{ secrets.ISLAND_READ_TOKEN != '' }}
    steps:
      - name: Check out the site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # The browser repo is private for now: DESIGN.md can only be fetched with an
      # ISLAND_READ_TOKEN secret (a fine-grained token with read access to island-browser/island).
      # Without it the check is skipped with a visible warning instead of blocking the deploy.
      # Scheduled and dispatched runs exist to ship a new release, so there a drift is reported but
      # does not block the deploy; pushes and pull requests still fail on it.
      - name: Check design tokens against Island's DESIGN.md
        if: env.HAS_ISLAND_TOKEN == 'true'
        continue-on-error: ${{ github.event_name == 'schedule' || github.event_name == 'repository_dispatch' }}
        run: npm run check:tokens
        env:
          ISLAND_READ_TOKEN: ${{ secrets.ISLAND_READ_TOKEN }}

      - name: Note the skipped token check
        if: env.HAS_ISLAND_TOKEN != 'true'
        run: echo "::warning::ISLAND_READ_TOKEN is not set, so the design-token check was skipped and the build uses the committed data snapshot."

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      # prebuild fetches CHANGELOG.md, VERSION, and the releases list; when a fetch fails it keeps
      # the snapshot committed under data/.
      - name: Build the static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /site
          NEXT_PUBLIC_SITE_URL: https://island-browser.github.io/site
          NEXT_TELEMETRY_DISABLED: "1"
          ISLAND_READ_TOKEN: ${{ secrets.ISLAND_READ_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload the Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: out

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
